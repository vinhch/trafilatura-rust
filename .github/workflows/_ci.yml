# Called by ci.yml on a pull request and a main push, and by release.yml on a tag.
name: _ci

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dependabot cannot move this pin: the ref is a branch tip, not a release. It must stay equal to
      # rust-version in Cargo.toml, so this job is also the MSRV check.
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          # test.sh checks with rustfmt and clippy; the minimal profile carries neither.
          components: rustfmt, clippy
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
      # The parity fixtures are unpacked from the tracked archive (docs/parity-harness.md); the
      # Windows job skips the parity tests because it does not unpack them.
      - name: Read the upstream pin
        if: matrix.os == 'ubuntu-latest'
        id: pin
        shell: bash
        run: echo "commit=$(sed -n 's/^commit = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Check out upstream at the pin
        if: matrix.os == 'ubuntu-latest'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adbar/trafilatura
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream
      - name: Install uv
        if: matrix.os == 'ubuntu-latest'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Unpack the parity fixtures
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: scripts/fixtures.sh
      - name: Test the fixture generator
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          TRAFILATURA_UPSTREAM: ${{ github.workspace }}/upstream
        run: uv run --frozen --project tools/parity pytest tools/parity/tests -q
      - name: Run every check
        shell: bash
        env:
          TRAFILATURA_UPSTREAM: ${{ github.workspace }}/upstream
          # Ubuntu unpacked the fixtures above: a missing set must fail here, not skip the parity test.
          PARITY_REQUIRE_FIXTURES: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
        run: scripts/test.sh
      - name: Upload the parity report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report
          path: .temp/parity/report.md
          # .temp is a hidden directory, which the action skips by default.
          include-hidden-files: true
          if-no-files-found: ignore
