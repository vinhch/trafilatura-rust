# Called by ci.yml on a pull request and a main push, and by release.yml on a tag.
name: _ci

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dependabot cannot move this pin: the ref is a branch tip, not a release. It must stay equal to
      # rust-version in Cargo.toml, so this job is also the MSRV check.
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          # test.sh checks with rustfmt and clippy; the minimal profile carries neither.
          components: rustfmt, clippy
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2,cargo-nextest@0.9.151
      # The parity fixtures are unpacked from the tracked archive (docs/parity-harness.md); the
      # Windows job skips the parity tests because it does not unpack them.
      - name: Read the upstream pin
        if: matrix.os == 'ubuntu-latest'
        id: pin
        shell: bash
        run: echo "commit=$(sed -n 's/^commit = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Check out upstream at the pin
        if: matrix.os == 'ubuntu-latest'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adbar/trafilatura
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream
      - name: Install uv
        if: matrix.os == 'ubuntu-latest'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Unpack the parity fixtures
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: scripts/fixtures.sh
      - name: Test the fixture generator
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          TRAFILATURA_UPSTREAM: ${{ github.workspace }}/upstream
        run: uv run --frozen --project tools/parity pytest tools/parity/tests -q
      - name: Run every check
        shell: bash
        env:
          TRAFILATURA_UPSTREAM: ${{ github.workspace }}/upstream
          # Ubuntu unpacked the fixtures above: a missing set must fail here, not skip the parity test.
          PARITY_REQUIRE_FIXTURES: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
        run: scripts/test.sh --report
      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
      - name: Publish the test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: test report (${{ matrix.os }})
          path: target/nextest/ci/junit.xml
          reporter: java-junit
      - name: Upload the parity report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report
          path: .temp/parity/report.md
          # .temp is a hidden directory, which the action skips by default.
          include-hidden-files: true
          if-no-files-found: ignore

  minimal-versions:
    name: minimal-versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The master commit: the release-branch pin of the test job hard-codes 1.98.1 and takes no `toolchain`
      # input, and cargo-minimal-versions would then run silently on stable through RUSTC_BOOTSTRAP. The
      # nightly is pinned by date and moves with the other toolchain pins (OI-6 in docs/phase-plan.md);
      # --direct needs -Z direct-minimal-versions.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-11-05
      - name: Show the toolchain
        run: rustc --version
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-hack@0.6.46,cargo-minimal-versions@0.1.38
      - name: Read the upstream pin
        id: pin
        shell: bash
        run: echo "commit=$(sed -n 's/^commit = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Check out upstream at the pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adbar/trafilatura
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream
      # No uv: without flags the script only unpacks the archive, with a tar that reads zstd.
      - name: Unpack the parity fixtures
        shell: bash
        run: scripts/fixtures.sh
      - name: Test at the lowest allowed versions
        shell: bash
        env:
          TRAFILATURA_UPSTREAM: ${{ github.workspace }}/upstream
          # The fixtures are unpacked above: a missing set must fail here, not skip the parity test.
          PARITY_REQUIRE_FIXTURES: '1'
        run: cargo minimal-versions test --direct --all-features
