# Checks that can fail without a code change, so they run on a schedule as well as on demand.
name: quality

on:
  schedule:
    # Mondays 05:00 UTC, before Dependabot's weekly run opens its pull requests.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      # A RustSec advisory published this week fails a lockfile that passed last week.
      - name: Check the lockfile against the advisory database
        run: cargo deny check advisories
