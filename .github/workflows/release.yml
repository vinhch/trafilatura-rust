name: release

on:
  push:
    tags:
      # `*` is any run of characters but `/`, so a pre-release tag such as v0.1.0-rc.1 matches too.
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  guard:
    name: guard
    # A deleted tag fires the same push event with nothing to build.
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, so the ancestry check below can see main.
          fetch-depth: 0
      # A tag on an unreviewed branch must not reach crates.io.
      - name: Check the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check the tag names the version the sources carry
        shell: bash
        # Read from the environment, not interpolated: a quote in a ref would break out of the quoting
        # it lands in.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: scripts/version.sh --tag "$REF_NAME"

  verify:
    name: verify
    needs: guard
    uses: ./.github/workflows/_ci.yml
    # The called test job asks for checks: write, which its caller must grant.
    permissions:
      contents: read
      checks: write

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    # The environment's required reviewers are the last gate before crates.io; crates.io trusts this
    # workflow in this environment (trusted publishing) and issues a token that lives 30 minutes.
    environment: crates-io
    # Job-level permissions replace the workflow's, so contents: read stays for the checkout.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
