[package]
name = "trafilatura-rust"
version = "0.0.0"
edition = "2024"
# Kept equal to the toolchain the CI workflow pins, so the CI run doubles as the MSRV check.
rust-version = "1.98"
description = "Web page main-text and metadata extraction, a Rust port of the Python trafilatura library."
license = "Apache-2.0"
repository = "https://github.com/vinhch/trafilatura-rust"
readme = "README.md"
keywords = ["html", "extraction", "scraping", "boilerplate", "text"]
categories = ["text-processing", "parser-implementations"]
publish = false
# The packaged crate is the library: no tests, fixtures, examples or repo tooling. A source file left
# out here fails the verify build of `cargo package` (scripts/test.{sh,ps1}).
include = ["/src/", "!/src/**/tests.rs", "!/src/**/tests/", "!/src/**/*cases.rs", "/build.rs", "/README.md", "/LICENSE", "/NOTICE"]

[package.metadata.docs.rs]
features = ["decompress"]

# The upstream Python release this port follows. AGENTS.md, docs/upstream-sync.md, build.rs and
# scripts/upstream.{sh,ps1} read it from here; no other file states it.
[package.metadata.upstream]
repository = "https://github.com/adbar/trafilatura"
version = "2.3.1"
commit = "e2f85c965662c7df26b73290ef175b2c2a5fdca6"

[dependencies]
blake2 = { version = "0.11", default-features = false }
brotli-decompressor = { version = "6.1", optional = true }
chardetng = "1"
encoding_rs = "0.8.29"
flate2 = { version = "1.1.10", optional = true }
html5ever = "0.40"
psl = { version = "2.1.164", default-features = false }
regex = "1.8.0"
ruzstd = { version = "0.9", optional = true }
web_atoms = "0.3"

[features]
# Hidden, unstable: lets the crate's own integration tests reach internals. Not public API.
__internals = []
# Decompresses gzip, zstd, brotli and zlib input before decoding (D-4).
decompress = ["dep:flate2", "dep:brotli-decompressor", "dep:ruzstd"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# The crate runs on untrusted pages and behind an FFI boundary, where a panic aborts the host.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
string_slice = "deny"
# Perf guards: warn on any new site.
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"
needless_collect = "warn"
redundant_clone = "warn"

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
dhat = "0.3"
serde_json = "1.0.100"
similar = "3"

[[test]]
name = "parity"
required-features = ["__internals"]

[[test]]
name = "baseline_tests"
required-features = ["__internals"]

[[test]]
name = "unit_tests"
required-features = ["__internals"]

[[test]]
name = "filters_tests"
required-features = ["__internals"]

[[test]]
name = "extraction_cases"
required-features = ["__internals"]

[[test]]
name = "main_extractor_cases"
required-features = ["__internals"]

[[test]]
name = "metadata_cases"
required-features = ["__internals"]

[[test]]
name = "xml_output_cases"
required-features = ["__internals"]

[[test]]
name = "output_format_cases"
required-features = ["__internals"]

[[test]]
name = "xml_tei_tests"
required-features = ["__internals"]

[[test]]
name = "metadata_tests"
required-features = ["__internals"]

[[test]]
name = "json_metadata_tests"
required-features = ["__internals"]

[[test]]
name = "deduplication_tests"
required-features = ["__internals"]

[[test]]
name = "realworld_tests"
required-features = ["__internals"]

[[test]]
name = "resource_guards"
required-features = ["__internals"]

# Every corpus page through extract_batch on one worker, in the dev profile (docs/batch.md).
[[test]]
name = "batch_stack"
required-features = ["__internals"]

# Measurements, not tests (scripts/measure.{sh,ps1}): they replace the default harness and run only
# with TRAFILATURA_MEASURE=1. Heap is its own binary because the dhat allocator slows the timings.
[[test]]
name = "measure_time"
harness = false
required-features = ["__internals"]

[[test]]
name = "measure_heap"
harness = false
required-features = ["__internals"]

[[test]]
name = "measure_threads"
harness = false
required-features = ["__internals"]

[[test]]
name = "measure_sample"
required-features = ["__internals"]

# Statistics-backed timing of the corpus sample and one synthetic page (scripts/measure and the CI regression job).
[[bench]]
name = "extract"
harness = false
required-features = ["__internals"]

# Tests run the parity corpus; opt-level 1 cuts it about 7x. dev stays at 0 for the stack proof
# in scripts/test.sh.
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 2
