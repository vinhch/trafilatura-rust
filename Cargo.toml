[package]
name = "trafilatura-rust"
version = "0.0.0"
edition = "2024"
# Kept equal to the toolchain the CI workflow pins, so the CI run doubles as the MSRV check.
rust-version = "1.98"
description = "Web page main-text and metadata extraction, a Rust port of the Python trafilatura library."
license = "Apache-2.0"
repository = "https://github.com/vinhch/trafilatura-rust"
readme = "README.md"
keywords = ["html", "extraction", "scraping", "boilerplate", "text"]
categories = ["text-processing", "parser-implementations"]
publish = false

# The upstream Python release this port follows. AGENTS.md, docs/upstream-sync.md and
# scripts/upstream.{sh,ps1} read it from here; no other file states it.
[package.metadata.upstream]
repository = "https://github.com/adbar/trafilatura"
version = "2.3.1"
commit = "e2f85c965662c7df26b73290ef175b2c2a5fdca6"

[dependencies]
brotli-decompressor = { version = "6.1", optional = true }
chardetng = "1"
encoding_rs = "0.8"
flate2 = { version = "1.1", optional = true }
html5ever = "0.40"
regex = "1"
ruzstd = { version = "0.9", optional = true }

[features]
# Hidden, unstable: lets the crate's own integration tests reach internals. Not public API.
__internals = []
# Decompresses gzip, zstd, brotli and zlib input before decoding (D-4).
decompress = ["dep:flate2", "dep:brotli-decompressor", "dep:ruzstd"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# The crate runs on untrusted pages and behind an FFI boundary, where a panic aborts the host.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
string_slice = "deny"

[dev-dependencies]
dhat = "0.3"
serde_json = "1"

[[test]]
name = "parity"
required-features = ["__internals"]

[[test]]
name = "unit_tests"
required-features = ["__internals"]

[[test]]
name = "main_extractor_cases"
required-features = ["__internals"]

# Measurements, not tests (scripts/measure.{sh,ps1}): they replace the default harness and run only
# with TRAFILATURA_MEASURE=1. Heap is its own binary because the dhat allocator slows the timings.
[[test]]
name = "measure_time"
harness = false
required-features = ["__internals"]

[[test]]
name = "measure_heap"
harness = false
required-features = ["__internals"]
